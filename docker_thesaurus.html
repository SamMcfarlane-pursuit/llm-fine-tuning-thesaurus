
        <!DOCTYPE html>
        <html>
        <head>
            <meta charset="utf-8">
            <title>Thesaurus Visualization</title>
            <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vis-network@9.1.2/dist/vis-network.min.js"></script>
            <style type="text/css">
                #mynetwork {
                    width: 100%;
                    height: 100%;
                    position: absolute;
                    top: 0;
                    left: 0;
                    border: none;
                    background-color: #ffffff;
                }
                body, html {
                    height: 100%;
                    margin: 0;
                    padding: 0;
                    overflow: hidden;
                }
                .vis-tooltip {
                    position: absolute;
                    visibility: hidden;
                    padding: 5px;
                    white-space: nowrap;
                    font-family: Arial, sans-serif;
                    font-size: 14px;
                    color: #000000;
                    background-color: #f5f5f5;
                    border-radius: 3px;
                    border: 1px solid #808080;
                    box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.2);
                    max-width: 300px;
                    word-wrap: break-word;
                    z-index: 900;
                }
            </style>
        </head>
        <body>
            <div id="mynetwork"></div>
            <script type="text/javascript">
                // Initialize the network
                var container = document.getElementById('mynetwork');
                var data = {"nodes": [{"id": "docker", "label": "docker", "color": "red", "size": 25, "title": "<div style='max-width:300px;'><b>docker</b><br/>a laborer who loads and unloads vessels in a port</div>"}, {"id": "docker container", "label": "docker container", "color": "blue", "size": 20, "title": "<div style='max-width:300px;'><b>docker container</b><br/></div>"}, {"id": "docker platform", "label": "docker platform", "color": "blue", "size": 20, "title": "<div style='max-width:300px;'><b>docker platform</b><br/></div>"}, {"id": "container", "label": "container", "color": "green", "size": 20, "title": "<div style='max-width:300px;'><b>container</b><br/>any object that can be used to hold things (especially a large metal boxlike object of standardized dimensions that can be loaded from one form of transport to another)</div>"}, {"id": "dockerfile", "label": "dockerfile", "color": "green", "size": 20, "title": "<div style='max-width:300px;'><b>dockerfile</b><br/></div>"}, {"id": "docker image", "label": "docker image", "color": "green", "size": 20, "title": "<div style='max-width:300px;'><b>docker image</b><br/></div>"}, {"id": "kubernetes", "label": "kubernetes", "color": "green", "size": 20, "title": "<div style='max-width:300px;'><b>kubernetes</b><br/></div>"}, {"id": "deployment", "label": "deployment", "color": "green", "size": 20, "title": "<div style='max-width:300px;'><b>deployment</b><br/>the distribution of forces in preparation for battle or work</div>"}], "edges": [{"from": "docker", "to": "docker container", "color": "blue", "width": 2, "title": "synonym"}, {"from": "docker", "to": "docker platform", "color": "blue", "width": 2, "title": "synonym"}, {"from": "docker", "to": "container", "color": "green", "width": 2, "title": "related"}, {"from": "docker", "to": "dockerfile", "color": "green", "width": 2, "title": "related"}, {"from": "docker", "to": "docker image", "color": "green", "width": 2, "title": "related"}, {"from": "docker", "to": "kubernetes", "color": "green", "width": 2, "title": "related"}, {"from": "docker", "to": "deployment", "color": "green", "width": 2, "title": "related"}]};
                var options = {"interaction": {"hover": true, "zoomView": true, "dragView": true, "navigationButtons": true, "keyboard": true, "tooltipDelay": 100}, "physics": {"stabilization": {"iterations": 100, "fit": true}}, "layout": {"improvedLayout": true}};
                var network = new vis.Network(container, data, options);

                // Make the network object globally accessible
                window.network = network;

                // Fit the network to the container on load
                network.once("afterDrawing", function() {
                    setTimeout(function() {
                        network.fit({
                            animation: {
                                duration: 1000,
                                easingFunction: 'easeInOutQuad'
                            }
                        });
                    }, 200);
                });

                // Add click event to nodes
                network.on("click", function(params) {
                    if (params.nodes.length > 0) {
                        var nodeId = params.nodes[0];
                        if (nodeId !== '') {
                            window.parent.location.href = '/visualize/' + encodeURIComponent(nodeId);
                        }
                    }
                });

                // Prevent errors when iframe is reloaded
                window.addEventListener('unload', function() {
                    if (network) {
                        try {
                            network.destroy();
                        } catch (e) {
                            console.log('Network already destroyed');
                        }
                    }
                });
            </script>
        </body>
        </html>
