
        <!DOCTYPE html>
        <html>
        <head>
            <meta charset="utf-8">
            <title>Thesaurus Visualization</title>
            <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vis-network@9.1.2/dist/vis-network.min.js"></script>
            <style type="text/css">
                #mynetwork {
                    width: 100%;
                    height: 100%;
                    position: absolute;
                    top: 0;
                    left: 0;
                    border: none;
                    background-color: #ffffff;
                }
                body, html {
                    height: 100%;
                    margin: 0;
                    padding: 0;
                    overflow: hidden;
                }
                .vis-tooltip {
                    position: absolute;
                    visibility: hidden;
                    padding: 5px;
                    white-space: nowrap;
                    font-family: Arial, sans-serif;
                    font-size: 14px;
                    color: #000000;
                    background-color: #f5f5f5;
                    border-radius: 3px;
                    border: 1px solid #808080;
                    box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.2);
                    max-width: 300px;
                    word-wrap: break-word;
                    z-index: 900;
                }
            </style>
        </head>
        <body>
            <div id="mynetwork"></div>
            <script type="text/javascript">
                // Initialize the network
                var container = document.getElementById('mynetwork');
                var data = {"nodes": [{"id": "fine-tuning", "label": "fine-tuning", "color": "red", "size": 25, "title": "<div style='max-width:300px;'><b>fine-tuning</b><br/>improve or perfect by pruning or polishing</div>"}, {"id": "adaptation", "label": "adaptation", "color": "blue", "size": 20, "title": "<div style='max-width:300px;'><b>adaptation</b><br/>a written work (as a novel) that has been recast in a new form</div>"}, {"id": "specialized training", "label": "specialized training", "color": "blue", "size": 20, "title": "<div style='max-width:300px;'><b>specialized training</b><br/></div>"}, {"id": "transfer learning", "label": "transfer learning", "color": "blue", "size": 20, "title": "<div style='max-width:300px;'><b>transfer learning</b><br/></div>"}, {"id": "llm", "label": "llm", "color": "green", "size": 20, "title": "<div style='max-width:300px;'><b>llm</b><br/>an advanced law degree</div>"}, {"id": "lora", "label": "lora", "color": "green", "size": 20, "title": "<div style='max-width:300px;'><b>lora</b><br/></div>"}, {"id": "peft", "label": "peft", "color": "green", "size": 20, "title": "<div style='max-width:300px;'><b>peft</b><br/></div>"}, {"id": "hyperparameters", "label": "hyperparameters", "color": "green", "size": 20, "title": "<div style='max-width:300px;'><b>hyperparameters</b><br/></div>"}, {"id": "training data", "label": "training data", "color": "green", "size": 20, "title": "<div style='max-width:300px;'><b>training data</b><br/></div>"}, {"id": "base model", "label": "base model", "color": "green", "size": 20, "title": "<div style='max-width:300px;'><b>base model</b><br/></div>"}, {"id": "adapter layers", "label": "adapter layers", "color": "green", "size": 20, "title": "<div style='max-width:300px;'><b>adapter layers</b><br/></div>"}], "edges": [{"from": "fine-tuning", "to": "adaptation", "color": "blue", "width": 2, "title": "synonym"}, {"from": "fine-tuning", "to": "specialized training", "color": "blue", "width": 2, "title": "synonym"}, {"from": "fine-tuning", "to": "transfer learning", "color": "blue", "width": 2, "title": "synonym"}, {"from": "fine-tuning", "to": "llm", "color": "green", "width": 2, "title": "related"}, {"from": "fine-tuning", "to": "lora", "color": "green", "width": 2, "title": "related"}, {"from": "fine-tuning", "to": "peft", "color": "green", "width": 2, "title": "related"}, {"from": "fine-tuning", "to": "hyperparameters", "color": "green", "width": 2, "title": "related"}, {"from": "fine-tuning", "to": "training data", "color": "green", "width": 2, "title": "related"}, {"from": "fine-tuning", "to": "base model", "color": "green", "width": 2, "title": "related"}, {"from": "fine-tuning", "to": "adapter layers", "color": "green", "width": 2, "title": "related"}]};
                var options = {"interaction": {"hover": true, "zoomView": true, "dragView": true, "navigationButtons": true, "keyboard": true, "tooltipDelay": 100}, "physics": {"stabilization": {"iterations": 100, "fit": true}}, "layout": {"improvedLayout": true}};
                var network = new vis.Network(container, data, options);

                // Make the network object globally accessible
                window.network = network;

                // Fit the network to the container on load
                network.once("afterDrawing", function() {
                    setTimeout(function() {
                        network.fit({
                            animation: {
                                duration: 1000,
                                easingFunction: 'easeInOutQuad'
                            }
                        });
                    }, 200);
                });

                // Add click event to nodes
                network.on("click", function(params) {
                    if (params.nodes.length > 0) {
                        var nodeId = params.nodes[0];
                        if (nodeId !== '') {
                            window.parent.location.href = '/visualize/' + encodeURIComponent(nodeId);
                        }
                    }
                });

                // Prevent errors when iframe is reloaded
                window.addEventListener('unload', function() {
                    if (network) {
                        try {
                            network.destroy();
                        } catch (e) {
                            console.log('Network already destroyed');
                        }
                    }
                });
            </script>
        </body>
        </html>
