
        <!DOCTYPE html>
        <html>
        <head>
            <meta charset="utf-8">
            <title>Thesaurus Visualization</title>
            <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vis-network@9.1.2/dist/vis-network.min.js"></script>
            <style type="text/css">
                #mynetwork {
                    width: 100%;
                    height: 100%;
                    position: absolute;
                    top: 0;
                    left: 0;
                    border: none;
                    background-color: #ffffff;
                }
                body, html {
                    height: 100%;
                    margin: 0;
                    padding: 0;
                    overflow: hidden;
                }
                .vis-tooltip {
                    position: absolute;
                    visibility: hidden;
                    padding: 5px;
                    white-space: nowrap;
                    font-family: Arial, sans-serif;
                    font-size: 14px;
                    color: #000000;
                    background-color: #f5f5f5;
                    border-radius: 3px;
                    border: 1px solid #808080;
                    box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.2);
                    max-width: 300px;
                    word-wrap: break-word;
                    z-index: 900;
                }
            </style>
        </head>
        <body>
            <div id="mynetwork"></div>
            <script type="text/javascript">
                // Initialize the network
                var container = document.getElementById('mynetwork');
                var data = {"nodes": [{"id": "happy", "label": "happy", "color": "red", "size": 25, "title": "<div style='max-width:300px;'><b>happy</b><br/>enjoying or showing or marked by joy or pleasure</div>"}, {"id": "unhappy", "label": "unhappy", "color": "orange", "size": 15, "title": "<div style='max-width:300px;'><b>unhappy</b><br/>experiencing or marked by or causing sadness or sorrow or discontent</div>"}, {"id": "felicitous", "label": "felicitous", "color": "blue", "size": 15, "title": "<div style='max-width:300px;'><b>felicitous</b><br/>exhibiting an agreeably appropriate manner or style</div>"}, {"id": "glad", "label": "glad", "color": "blue", "size": 15, "title": "<div style='max-width:300px;'><b>glad</b><br/>any of numerous plants of the genus Gladiolus native chiefly to tropical and South Africa having sword-shaped leaves and one-sided spikes of brightly colored funnel-shaped flowers; widely cultivated</div>"}, {"id": "well-chosen", "label": "well-chosen", "color": "blue", "size": 15, "title": "<div style='max-width:300px;'><b>well-chosen</b><br/>well expressed and to the point</div>"}], "edges": [{"from": "happy", "to": "unhappy", "color": "orange", "width": 2, "title": "antonym"}, {"from": "happy", "to": "felicitous", "color": "blue", "width": 2, "title": "synonym"}, {"from": "happy", "to": "glad", "color": "blue", "width": 2, "title": "synonym"}, {"from": "happy", "to": "well-chosen", "color": "blue", "width": 2, "title": "synonym"}]};
                var options = {"interaction": {"hover": true, "zoomView": true, "dragView": true, "navigationButtons": true, "keyboard": true, "tooltipDelay": 100}, "physics": {"stabilization": {"iterations": 100, "fit": true}}, "layout": {"improvedLayout": true}};
                var network = new vis.Network(container, data, options);

                // Make the network object globally accessible
                window.network = network;

                // Fit the network to the container on load
                network.once("afterDrawing", function() {
                    setTimeout(function() {
                        network.fit({
                            animation: {
                                duration: 1000,
                                easingFunction: 'easeInOutQuad'
                            }
                        });
                    }, 200);
                });

                // Add click event to nodes
                network.on("click", function(params) {
                    if (params.nodes.length > 0) {
                        var nodeId = params.nodes[0];
                        if (nodeId !== '') {
                            window.parent.location.href = '/visualize/' + encodeURIComponent(nodeId);
                        }
                    }
                });

                // Prevent errors when iframe is reloaded
                window.addEventListener('unload', function() {
                    if (network) {
                        try {
                            network.destroy();
                        } catch (e) {
                            console.log('Network already destroyed');
                        }
                    }
                });
            </script>
        </body>
        </html>
