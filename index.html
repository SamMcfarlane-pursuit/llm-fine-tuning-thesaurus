<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Calculator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #f7f7f7;
            color: #333;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 20px;
            padding: 30px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        h1, h2 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            background-color: #2c3e50;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 18px;
            transition: background-color 0.3s ease;
            margin-bottom: 10px;
        }

        button:hover {
            background-color: #1a2530;
        }

        #results {
            margin-top: 30px;
            padding: 20px;
            background-color: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 5px;
        }

        #budget-breakdown {
            margin-top: 30px;
            text-align: center;
        }

        canvas {
            max-width: 400px;
            margin: 0 auto;
        }

        /* Responsive layout */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
                margin: 10px;
            }

            input[type="number"],
            button {
                font-size: 16px;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h1>Budget Calculator</h1>

        <label for="annualSalary">Annual Salary:</label>
        <input type="number" id="annualSalary" placeholder="Enter annual salary">

        <label for="rent">Rent/Mortgage:</label>
        <input type="number" id="rent" placeholder="Enter monthly rent/mortgage">

        <label for="utilities">Utilities:</label>
        <input type="number" id="utilities" placeholder="Enter monthly utilities cost">

        <label for="food">Food:</label>
        <input type="number" id="food" placeholder="Enter monthly food expenses">

        <label for="transportation">Transportation:</label>
        <input type="number" id="transportation" placeholder="Enter monthly transportation expenses">

        <label for="entertainment">Entertainment:</label>
        <input type="number" id="entertainment" placeholder="Enter monthly entertainment expenses">

        <label for="clothing">Clothing:</label>
        <input type="number" id="clothing" placeholder="Enter monthly clothing expenses">

        <label for="savings">Savings:</label>
        <input type="number" id="savings" placeholder="Enter monthly savings">

        <button type="button" onclick="calculateBudget()">Calculate Budget</button>
        <button type="button" onclick="clearInputs()">Clear</button>

        <div id="results">
            <h2>Results</h2>
            <p id="monthlyIncome"></p>
            <p id="bondPayment"></p>
            <p id="remainingBudget"></p>
        </div>

        <div id="budget-breakdown">
            <h2>Budget Breakdown</h2>
            <canvas id="budgetChart"></canvas>
        </div>
    </div>

    <script>
        // Function to get data from local storage
        function getLocalStorageData() {
            const annualSalary = localStorage.getItem('annualSalary') || '';
            const rent = localStorage.getItem('rent') || '';
            const utilities = localStorage.getItem('utilities') || '';
            const food = localStorage.getItem('food') || '';
            const transportation = localStorage.getItem('transportation') || '';
            const entertainment = localStorage.getItem('entertainment') || '';
            const clothing = localStorage.getItem('clothing') || '';
            const savings = localStorage.getItem('savings') || '';

            return { annualSalary, rent, utilities, food, transportation, entertainment, clothing, savings };
        }

        // Function to set data to local storage
        function setLocalStorageData(data) {
            localStorage.setItem('annualSalary', data.annualSalary);
            localStorage.setItem('rent', data.rent);
            localStorage.setItem('utilities', data.utilities);
            localStorage.setItem('food', data.food);
            localStorage.setItem('transportation', data.transportation);
            localStorage.setItem('entertainment', data.entertainment);
            localStorage.setItem('clothing', data.clothing);
            localStorage.setItem('savings', data.savings);
        }

        // Function to load data from local storage
        function loadData() {
            const data = getLocalStorageData();
            document.getElementById('annualSalary').value = data.annualSalary;
            document.getElementById('rent').value = data.rent;
            document.getElementById('utilities').value = data.utilities;
            document.getElementById('food').value = data.food;
            document.getElementById('transportation').value = data.transportation;
            document.getElementById('entertainment').value = data.entertainment;
            document.getElementById('clothing').value = data.clothing;
            document.getElementById('savings').value = data.savings;
        }

        // Function to clear input fields
        function clearInputs() {
            document.getElementById('annualSalary').value = '';
            document.getElementById('rent').value = '';
            document.getElementById('utilities').value = '';
            document.getElementById('food').value = '';
            document.getElementById('transportation').value = '';
            document.getElementById('entertainment').value = '';
            document.getElementById('clothing').value = '';
            document.getElementById('savings').value = '';

            localStorage.clear();
        }

        // Function to calculate budget
        function calculateBudget() {
            // Get input values
            const annualSalary = parseFloat(document.getElementById("annualSalary").value) || 0;
            const rent = parseFloat(document.getElementById("rent").value) || 0;
            const utilities = parseFloat(document.getElementById("utilities").value) || 0;
            const food = parseFloat(document.getElementById("food").value) || 0;
            const transportation = parseFloat(document.getElementById("transportation").value) || 0;
            const entertainment = parseFloat(document.getElementById("entertainment").value) || 0;
            const clothing = parseFloat(document.getElementById("clothing").value) || 0;
            const savings = parseFloat(document.getElementById("savings").value) || 0;

            // Validate input values
            if (annualSalary < 0 || rent < 0 || utilities < 0 || food < 0 || transportation < 0 || entertainment < 0 || clothing < 0 || savings < 0) {
                alert("Please enter valid positive numbers.");
                return;
            }

            // Save data to local storage
            setLocalStorageData({
                annualSalary: annualSalary.toString(),
                rent: rent.toString(),
                utilities: utilities.toString(),
                food: food.toString(),
                transportation: transportation.toString(),
                entertainment: entertainment.toString(),
                clothing: clothing.toString(),
                savings: savings.toString()
            });

            // Calculate monthly income
            const monthlyIncome = annualSalary / 12;
            document.getElementById("monthlyIncome").innerText = `Monthly Income: $${monthlyIncome.toFixed(2)}`;

            // Calculate bond payment (15% of monthly income if salary >= $85,000)
            let bondPayment = 0;
            if (annualSalary >= 85000) {
                bondPayment = monthlyIncome * 0.15;
            }
            document.getElementById("bondPayment").innerText = `Bond Payment: $${bondPayment.toFixed(2)}`;

            // Calculate remaining budget
            const totalExpenses = rent + utilities + food + transportation + entertainment + clothing + savings + bondPayment;
            const remainingBudget = monthlyIncome - totalExpenses;
            document.getElementById("remainingBudget").innerText = `Remaining Budget: $${remainingBudget.toFixed(2)}`;

            // Display budget breakdown (Chart.js)
            const budgetChartCanvas = document.getElementById('budgetChart').getContext('2d');
            const budgetChart = new Chart(budgetChartCanvas, {
                type: 'pie',
                data: {
                    labels: ['Rent', 'Utilities', 'Food', 'Transportation', 'Entertainment', 'Clothing', 'Savings', 'Bond Payment'],
                    datasets: [{
                        label: 'Budget Breakdown',
                        data: [rent, utilities, food, transportation, entertainment, clothing, savings, bondPayment],
                        backgroundColor: [
                            'rgba(0, 123, 255, 0.7)',
                            'rgba(108, 117, 125, 0.7)',
                            'rgba(40, 167, 69, 0.7)',
                            'rgba(220, 53, 69, 0.7)',
                            'rgba(255, 193, 7, 0.7)',
                            'rgba(23, 162, 184, 0.7)',
                            'rgba(232, 62, 140, 0.7)',
                            'rgba(253, 126, 20, 0.7)'
                        ],
                        borderColor: [
                            'rgba(0, 123, 255, 1)',
                            'rgba(108, 117, 125, 1)',
                            'rgba(40, 167, 69, 1)',
                            'rgba(220, 53, 69, 1)',
                            'rgba(255, 193, 7, 1)',
                            'rgba(23, 162, 184, 1)',
                            'rgba(232, 62, 140, 1)',
                            'rgba(253, 126, 20, 1)'
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                        },
                        title: {
                            display: true,
                            text: 'Budget Breakdown'
                        }
                    }
                }
            });
        }

        // Load data when the page loads
        loadData();
    </script>
</body>
</html>
