<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Card Pattern UI Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: #23243a;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modern-card-container {
      display: flex;
      gap: 32px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 40px 0;
    }
    .modern-card {
      background: linear-gradient(135deg, #23234f 0%, #3a3ad6 100%);
      border-radius: 18px;
      box-shadow: 0 8px 32px rgba(44, 62, 80, 0.18), 0 1.5px 6px rgba(44, 62, 80, 0.10);
      min-width: 280px;
      max-width: 350px;
      flex: 1 1 280px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      transition: transform 0.18s cubic-bezier(.4,2,.6,1), box-shadow 0.18s;
      padding: 0;
      overflow: hidden;
    }
    .modern-card:hover {
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 16px 48px rgba(44, 62, 80, 0.22), 0 2px 8px rgba(44, 62, 80, 0.13);
    }
    .modern-card-content {
      padding: 32px 28px 28px 28px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      background: rgba(255,255,255,0.01);
    }
    .modern-card-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #fff;
      margin: 0 0 12px 0;
      letter-spacing: 0.01em;
    }
    .modern-card-desc {
      font-size: 1rem;
      color: #e0e6ff;
      margin: 0 0 24px 0;
    }
    .modern-card-action {
      background: linear-gradient(90deg, #fff 60%, #e0e6ff 100%);
      color: #23234f;
      border: none;
      border-radius: 8px;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(44, 62, 80, 0.10);
      transition: background 0.2s, color 0.2s, box-shadow 0.2s;
      margin-top: auto;
      display: inline-block;
    }
    .modern-card-action:hover, .modern-card-action:focus-visible {
      background: linear-gradient(90deg, #3a3ad6 0%, #23234f 100%);
      color: #fff;
      box-shadow: 0 4px 16px rgba(44, 62, 80, 0.18);
    }
    @media (max-width: 800px) {
      .modern-card-container {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>
  <div class="modern-card-container">
    <div class="modern-card">
      <div class="modern-card-content">
        <h3 class="modern-card-title">Create an account</h3>
        <p class="modern-card-desc">Sign up to track your progress and unlock all features.</p>
        <a href="#" class="modern-card-action">Sign Up</a>
      </div>
    </div>
    <div class="modern-card">
      <div class="modern-card-content">
        <h3 class="modern-card-title">Explore the Concept Map</h3>
        <p class="modern-card-desc">Visualize and discover LLM fine-tuning concepts interactively.</p>
        <a href="#" class="modern-card-action">Explore Now</a>
      </div>
    </div>
  </div>
</body>
</html>
