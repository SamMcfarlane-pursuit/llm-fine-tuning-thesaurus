databases:
- name: visual-llm-db
  plan: free
services:
- buildCommand: pip install -r requirements.txt
  env: python
  envVars:
  - key: FLASK_ENV
    value: production
  - key: PYTHONPATH
    value: .
  - key: WEB_CONCURRENCY
    value: '2'
  healthCheckPath: /health
  name: visual-llm-platform
  plan: free
  startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
  type: web
