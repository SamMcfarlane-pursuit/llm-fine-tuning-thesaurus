<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error - Thesaurus LLM Fine-Tuning</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #212529;
        }
        .error-container {
            max-width: 800px;
            margin: 100px auto;
            padding: 30px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
        .error-image {
            max-width: 300px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-container text-center">
            <h1 class="display-1 text-danger">500</h1>
            <h2 class="mb-4">Server Error</h2>
            <p class="lead mb-4">Something went wrong on our end. We're working to fix the issue.</p>
            
            <div class="error-image mb-4">
                <img src="/static/images/500.svg" alt="500 Error" class="img-fluid">
            </div>
            
            <div class="d-grid gap-3 d-md-flex justify-content-md-center">
                <a href="/" class="btn btn-primary btn-lg">
                    <i class="bi bi-house-door me-2"></i>Go to Home
                </a>
                <button onclick="window.location.reload();" class="btn btn-outline-primary btn-lg">
                    <i class="bi bi-arrow-clockwise me-2"></i>Try Again
                </button>
                <a href="/contact" class="btn btn-outline-danger btn-lg">
                    <i class="bi bi-envelope me-2"></i>Report Issue
                </a>
            </div>
            
            <div class="mt-5">
                <p>If the problem persists, please contact our support team.</p>
                <a href="/contact" class="btn btn-outline-secondary">
                    <i class="bi bi-envelope me-2"></i>Contact Support
                </a>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
