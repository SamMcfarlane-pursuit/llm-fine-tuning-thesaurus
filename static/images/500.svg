            <line x1="0" y1="40" x2="120" y2="40" id="Line-1" stroke="#DC3545" stroke-width="6"></line>
            <line x1="0" y1="80" x2="120" y2="80" id="Line-2" stroke="#DC3545" stroke-width="6"></line>
            <line x1="0" y1="120" x2="120" y2="120" id="Line-3" stroke="#DC3545" stroke-width="6"></line>
            <circle id="Light-1" fill="#DC3545" cx="20" cy="20" r="8"></circle>
            <circle id="Light-2" fill="#DC3545" cx="50" cy="20" r="8"></circle>
            <path d="M80,12 L100,28 L80,28 L80,12 Z" id="Warning" fill="#DC3545"></path>
        </g>
        <text id="Server-Error" font-family="Arial-BoldMT, Arial" font-size="24" font-weight="bold" fill="#333333">
