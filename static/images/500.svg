<?xml version="1.0" encoding="UTF-8"?>
<svg width="800px" height="400px" viewBox="0 0 800 400" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <title>500 Error</title>
    <defs>
        <linearGradient x1="50%" y1="0%" x2="50%" y2="100%" id="linearGradient-1">
            <stop stop-color="#DC3545" stop-opacity="0.2" offset="0%"></stop>
            <stop stop-color="#DC3545" stop-opacity="0.1" offset="100%"></stop>
        </linearGradient>
    </defs>
    <g id="500-Error" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <rect id="Background" fill="url(#linearGradient-1)" x="0" y="0" width="800" height="400" rx="20"></rect>
        <text id="500" font-family="Arial-BoldMT, Arial" font-size="180" font-weight="bold" fill="#DC3545">
            <tspan x="200" y="240">500</tspan>
        </text>
        <g id="Server" transform="translate(500.000000, 150.000000)">
