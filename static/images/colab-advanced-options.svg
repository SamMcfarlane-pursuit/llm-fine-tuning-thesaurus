<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="600" height="350" viewBox="0 0 600 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with rounded corners -->
  <rect x="0" y="0" width="600" height="350" rx="10" ry="10" fill="#f5f5f5" stroke="#ddd" stroke-width="2"/>
  
  <!-- Colab Cell Container -->
  <rect x="50" y="50" width="500" height="250" rx="5" ry="5" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
  
  <!-- Cell Number -->
  <rect x="50" y="50" width="40" height="30" fill="#f1f3f4" stroke="#e0e0e0" stroke-width="1"/>
  <text x="70" y="70" font-family="Arial" font-size="14" text-anchor="middle" fill="#666666">[3]</text>
  
  <!-- Code Content -->
  <text x="120" y="80" font-family="Consolas, monospace" font-size="14" fill="#333333"># Configure LoRA</text>
  <text x="120" y="100" font-family="Consolas, monospace" font-size="14" fill="#0000ff">from</text>
  <text x="155" y="100" font-family="Consolas, monospace" font-size="14" fill="#333333"> peft </text>
  <text x="195" y="100" font-family="Consolas, monospace" font-size="14" fill="#0000ff">import</text>
  <text x="240" y="100" font-family="Consolas, monospace" font-size="14" fill="#333333"> LoraConfig, get_peft_model</text>
  
  <text x="120" y="120" font-family="Consolas, monospace" font-size="14" fill="#333333"></text>
  <text x="120" y="140" font-family="Consolas, monospace" font-size="14" fill="#333333">config = LoraConfig(</text>
  <text x="140" y="160" font-family="Consolas, monospace" font-size="14" fill="#333333">r=16,                      # Rank dimension</text>
  <text x="140" y="180" font-family="Consolas, monospace" font-size="14" fill="#333333">lora_alpha=32,             # Alpha parameter</text>
  <text x="140" y="200" font-family="Consolas, monospace" font-size="14" fill="#333333">target_modules=["q_proj", "v_proj"],  # Which modules to apply LoRA to</text>
  <text x="140" y="220" font-family="Consolas, monospace" font-size="14" fill="#333333">lora_dropout=0.05,         # Dropout probability</text>
  <text x="140" y="240" font-family="Consolas, monospace" font-size="14" fill="#333333">bias="none",               # Bias type</text>
  <text x="140" y="260" font-family="Consolas, monospace" font-size="14" fill="#333333">task_type="CAUSAL_LM"      # Task type</text>
  <text x="120" y="280" font-family="Consolas, monospace" font-size="14" fill="#333333">)</text>
  
  <!-- Annotation Arrows -->
  <path d="M350,160 Q400,160 420,120" fill="none" stroke="#4285f4" stroke-width="2" stroke-dasharray="5,5"/>
  <rect x="420" y="100" width="150" height="40" rx="5" ry="5" fill="#e8f0fe" stroke="#4285f4" stroke-width="1"/>
  <text x="495" y="125" font-family="Arial" font-size="12" text-anchor="middle" fill="#4285f4">Try different rank values</text>
  
  <path d="M350,200 Q400,200 420,200" fill="none" stroke="#4285f4" stroke-width="2" stroke-dasharray="5,5"/>
  <rect x="420" y="180" width="150" height="40" rx="5" ry="5" fill="#e8f0fe" stroke="#4285f4" stroke-width="1"/>
  <text x="495" y="205" font-family="Arial" font-size="12" text-anchor="middle" fill="#4285f4">Experiment with different</text>
  <text x="495" y="220" font-family="Arial" font-size="12" text-anchor="middle" fill="#4285f4">target modules</text>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#4285f4">Advanced LoRA Configuration Options</text>
</svg>
