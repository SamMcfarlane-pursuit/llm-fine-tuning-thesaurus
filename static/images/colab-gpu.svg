<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with rounded corners -->
  <rect x="0" y="0" width="600" height="400" rx="10" ry="10" fill="#f5f5f5" stroke="#ddd" stroke-width="2"/>
  
  <!-- Dialog Box -->
  <rect x="100" y="50" width="400" height="300" rx="8" ry="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
  
  <!-- Dialog Header -->
  <rect x="100" y="50" width="400" height="40" rx="8" ry="8" fill="#f1f3f4" stroke="#e0e0e0" stroke-width="1"/>
  <text x="300" y="75" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#202124">Notebook settings</text>
  
  <!-- Hardware Accelerator Section -->
  <text x="130" y="120" font-family="Arial" font-size="14" font-weight="bold" fill="#202124">Hardware accelerator</text>
  <text x="130" y="140" font-family="Arial" font-size="12" fill="#5f6368">Select the hardware accelerator to use for this notebook.</text>
  
  <!-- Radio Buttons -->
  <circle cx="130" cy="170" r="8" fill="#ffffff" stroke="#5f6368" stroke-width="1"/>
  <text x="150" y="175" font-family="Arial" font-size="14" fill="#202124">None</text>
  
  <circle cx="130" cy="200" r="8" fill="#ffffff" stroke="#4285f4" stroke-width="2"/>
  <circle cx="130" cy="200" r="4" fill="#4285f4"/>
  <text x="150" y="205" font-family="Arial" font-size="14" fill="#202124" font-weight="bold">GPU</text>
  <rect x="150" y="210" width="320" height="20" rx="3" ry="3" fill="#e8f0fe" stroke="none"/>
  <text x="160" y="225" font-family="Arial" font-size="12" fill="#4285f4">Recommended for training neural networks with TensorFlow, PyTorch</text>
  
  <circle cx="130" cy="250" r="8" fill="#ffffff" stroke="#5f6368" stroke-width="1"/>
  <text x="150" y="255" font-family="Arial" font-size="14" fill="#202124">TPU</text>
  
  <!-- Save Button -->
  <rect x="400" y="300" width="80" height="35" rx="5" ry="5" fill="#4285f4" stroke="none"/>
  <text x="440" y="323" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">SAVE</text>
  
  <!-- Cancel Button -->
  <rect x="310" y="300" width="80" height="35" rx="5" ry="5" fill="#ffffff" stroke="#5f6368" stroke-width="1"/>
  <text x="350" y="323" font-family="Arial" font-size="14" text-anchor="middle" fill="#5f6368">CANCEL</text>
  
  <!-- Annotation Arrow -->
  <path d="M130,200 Q80,200 80,250 Q80,300 150,300" fill="none" stroke="#4285f4" stroke-width="2" stroke-dasharray="5,5"/>
  <rect x="150" y="280" width="150" height="40" rx="5" ry="5" fill="#e8f0fe" stroke="#4285f4" stroke-width="1"/>
  <text x="225" y="305" font-family="Arial" font-size="14" text-anchor="middle" fill="#4285f4">Select GPU option</text>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#4285f4">Google Colab: Enabling GPU Acceleration</text>
  
  <!-- Steps -->
  <rect x="20" y="100" width="60" height="30" rx="15" ry="15" fill="#4285f4" stroke="none"/>
  <text x="50" y="120" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text>
  <text x="50" y="145" font-family="Arial" font-size="12" text-anchor="middle" fill="#5f6368">Runtime</text>
  
  <rect x="20" y="170" width="60" height="30" rx="15" ry="15" fill="#4285f4" stroke="none"/>
  <text x="50" y="190" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text>
  <text x="50" y="215" font-family="Arial" font-size="12" text-anchor="middle" fill="#5f6368">Change runtime</text>
  <text x="50" y="230" font-family="Arial" font-size="12" text-anchor="middle" fill="#5f6368">type</text>
  
  <rect x="20" y="260" width="60" height="30" rx="15" ry="15" fill="#4285f4" stroke="none"/>
  <text x="50" y="280" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text>
  <text x="50" y="305" font-family="Arial" font-size="12" text-anchor="middle" fill="#5f6368">Select GPU</text>
  
  <rect x="20" y="340" width="60" height="30" rx="15" ry="15" fill="#4285f4" stroke="none"/>
  <text x="50" y="360" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text>
  <text x="50" y="385" font-family="Arial" font-size="12" text-anchor="middle" fill="#5f6368">Click Save</text>
</svg>
