<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with rounded corners -->
  <rect x="0" y="0" width="600" height="300" rx="10" ry="10" fill="#f5f5f5" stroke="#ddd" stroke-width="2"/>
  
  <!-- Colab Cell Container -->
  <rect x="50" y="50" width="500" height="200" rx="5" ry="5" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
  
  <!-- Cell Number -->
  <rect x="50" y="50" width="40" height="30" fill="#f1f3f4" stroke="#e0e0e0" stroke-width="1"/>
  <text x="70" y="70" font-family="Arial" font-size="14" text-anchor="middle" fill="#666666">[1]</text>
  
  <!-- Play Button Highlight -->
  <circle cx="80" cy="100" r="25" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <polygon points="75,90 75,110 90,100" fill="#4285f4"/>
  
  <!-- Code Content -->
  <text x="120" y="100" font-family="Consolas, monospace" font-size="14" fill="#333333">import torch</text>
  <text x="120" y="120" font-family="Consolas, monospace" font-size="14" fill="#333333">from transformers import AutoModelForCausalLM, AutoTokenizer</text>
  <text x="120" y="140" font-family="Consolas, monospace" font-size="14" fill="#333333">from peft import get_peft_model, LoraConfig, TaskType</text>
  
  <!-- Annotation Arrow -->
  <path d="M80,140 Q80,180 120,180" fill="none" stroke="#4285f4" stroke-width="2" stroke-dasharray="5,5"/>
  <rect x="120" y="160" width="300" height="60" rx="5" ry="5" fill="#e8f0fe" stroke="#4285f4" stroke-width="1"/>
  <text x="135" y="185" font-family="Arial" font-size="14" fill="#4285f4">Click the play button to run the cell</text>
  <text x="135" y="205" font-family="Arial" font-size="14" fill="#4285f4">or press Shift+Enter</text>
  
  <!-- Colab Logo -->
  <g transform="translate(480, 70) scale(0.5)">
    <path d="M32.5,22.5h65v65h-65z" fill="#F9AB00"/>
    <path d="M32.5,22.5l65,65h-65z" fill="#E37400"/>
    <path d="M0,55h65v65H0z" fill="#F9AB00"/>
    <path d="M0,120l65-65v65z" fill="#E37400"/>
  </g>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#4285f4">Google Colab: Running a Code Cell</text>
</svg>
