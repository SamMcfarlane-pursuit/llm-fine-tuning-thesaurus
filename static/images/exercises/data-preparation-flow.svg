<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#f8f9fa" rx="10" ry="10" />
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">Data Preparation & Evaluation Flow</text>
  
  <!-- Flow Diagram -->
  <!-- Raw Data -->
  <rect x="50" y="100" width="120" height="80" fill="#e9ecef" stroke="#495057" stroke-width="2" rx="10" ry="10" />
  <text x="110" y="145" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Raw Data</text>
  
  <!-- Preprocessing -->
  <rect x="240" y="100" width="120" height="80" fill="#d0e8f2" stroke="#0077b6" stroke-width="2" rx="10" ry="10" />
  <text x="300" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0077b6">Preprocessing</text>
  <text x="300" y="155" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#0077b6">Cleaning, Formatting</text>
  
  <!-- Train/Test Split -->
  <rect x="430" y="100" width="120" height="80" fill="#d0e8f2" stroke="#0077b6" stroke-width="2" rx="10" ry="10" />
  <text x="490" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0077b6">Train/Test</text>
  <text x="490" y="155" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#0077b6">90/10 Split</text>
  
  <!-- Tokenization -->
  <rect x="620" y="100" width="120" height="80" fill="#d0e8f2" stroke="#0077b6" stroke-width="2" rx="10" ry="10" />
  <text x="680" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0077b6">Tokenization</text>
  <text x="680" y="155" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#0077b6">Convert to IDs</text>
  
  <!-- Training -->
  <rect x="240" y="240" width="120" height="80" fill="#ffe8d6" stroke="#bc6c25" stroke-width="2" rx="10" ry="10" />
  <text x="300" y="270" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#bc6c25">Training</text>
  <text x="300" y="295" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#bc6c25">Fine-tuning Model</text>
  
  <!-- Evaluation -->
  <rect x="430" y="240" width="120" height="80" fill="#ffe8d6" stroke="#bc6c25" stroke-width="2" rx="10" ry="10" />
  <text x="490" y="270" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#bc6c25">Evaluation</text>
  <text x="490" y="295" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#bc6c25">Metrics: ROUGE, BLEU</text>
  
  <!-- Deployment -->
  <rect x="620" y="240" width="120" height="80" fill="#ffe8d6" stroke="#bc6c25" stroke-width="2" rx="10" ry="10" />
  <text x="680" y="270" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#bc6c25">Deployment</text>
  <text x="680" y="295" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#bc6c25">Inference API</text>
  
  <!-- Arrows -->
  <!-- Horizontal Arrows - Top Row -->
  <path d="M 170 140 L 240 140" stroke="#6c757d" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M 360 140 L 430 140" stroke="#6c757d" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M 550 140 L 620 140" stroke="#6c757d" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- Vertical Arrow -->
  <path d="M 680 180 L 680 210 L 300 210 L 300 240" stroke="#6c757d" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- Horizontal Arrows - Bottom Row -->
  <path d="M 360 280 L 430 280" stroke="#6c757d" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M 550 280 L 620 280" stroke="#6c757d" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6c757d" />
    </marker>
  </defs>
  
  <!-- Key Points -->
  <rect x="50" y="340" width="700" height="40" fill="#e6f2ff" stroke="#0077b6" stroke-width="1" rx="5" ry="5" />
  <text x="400" y="365" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">High-quality data preparation is crucial for successful fine-tuning • Always evaluate on held-out test data</text>
</svg>
