<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid meet">
  <!-- Enhanced Background with gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f8ff;stop-opacity:1" />
    </linearGradient>

    <!-- Glow filter for highlighting -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Shadow filter for depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.3" />
    </filter>

    <!-- Arrowhead marker with enhanced styling -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4287f5" />
    </marker>

    <!-- Gradients for boxes -->
    <linearGradient id="raw-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e9ecef;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dee2e6;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="process-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d0e8f2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#90cdf4;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="train-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe8d6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffd8a8;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="info-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e6f2ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c5e3ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Enhanced Background -->
  <rect width="800" height="400" fill="url(#bg-gradient)" rx="15" ry="15" filter="url(#shadow)" />

  <!-- Enhanced Title with shadow -->
  <text x="400" y="45" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a365d" filter="url(#shadow)">Data Preparation & Evaluation Flow</text>

  <!-- Flow Diagram with enhanced styling -->
  <!-- Raw Data -->
  <rect x="50" y="100" width="120" height="80" fill="url(#raw-gradient)" stroke="#4287f5" stroke-width="3" rx="12" ry="12" filter="url(#shadow)">
    <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite" />
  </rect>
  <text x="110" y="145" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a365d">Raw Data</text>
  <text x="110" y="165" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#4a5568">Input Dataset</text>

  <!-- Preprocessing -->
  <rect x="240" y="100" width="120" height="80" fill="url(#process-gradient)" stroke="#4287f5" stroke-width="3" rx="12" ry="12" filter="url(#shadow)">
    <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite" begin="0.5s" />
  </rect>
  <text x="300" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a365d">Preprocessing</text>
  <text x="300" y="155" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2b6cb0">Cleaning, Formatting</text>

  <!-- Train/Test Split -->
  <rect x="430" y="100" width="120" height="80" fill="url(#process-gradient)" stroke="#4287f5" stroke-width="3" rx="12" ry="12" filter="url(#shadow)">
    <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite" begin="1s" />
  </rect>
  <text x="490" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a365d">Train/Test</text>
  <text x="490" y="155" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2b6cb0">90/10 Split</text>

  <!-- Tokenization -->
  <rect x="620" y="100" width="120" height="80" fill="url(#process-gradient)" stroke="#4287f5" stroke-width="3" rx="12" ry="12" filter="url(#shadow)">
    <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite" begin="1.5s" />
  </rect>
  <text x="680" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a365d">Tokenization</text>
  <text x="680" y="155" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2b6cb0">Convert to IDs</text>

  <!-- Training -->
  <rect x="240" y="240" width="120" height="80" fill="url(#train-gradient)" stroke="#e67e22" stroke-width="3" rx="12" ry="12" filter="url(#shadow)">
    <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite" begin="2s" />
  </rect>
  <text x="300" y="270" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#7b341e">Training</text>
  <text x="300" y="295" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#9c4221">Fine-tuning Model</text>

  <!-- Evaluation -->
  <rect x="430" y="240" width="120" height="80" fill="url(#train-gradient)" stroke="#e67e22" stroke-width="3" rx="12" ry="12" filter="url(#shadow)">
    <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite" begin="2.5s" />
  </rect>
  <text x="490" y="270" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#7b341e">Evaluation</text>
  <text x="490" y="295" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#9c4221">Metrics: ROUGE, BLEU</text>

  <!-- Deployment -->
  <rect x="620" y="240" width="120" height="80" fill="url(#train-gradient)" stroke="#e67e22" stroke-width="3" rx="12" ry="12" filter="url(#shadow)">
    <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite" begin="3s" />
  </rect>
  <text x="680" y="270" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#7b341e">Deployment</text>
  <text x="680" y="295" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#9c4221">Inference API</text>

  <!-- Enhanced Arrows with animation -->
  <!-- Horizontal Arrows - Top Row -->
  <path d="M 170 140 L 240 140" stroke="#4287f5" stroke-width="3" fill="none" marker-end="url(#arrowhead)">
    <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="0.2s" />
  </path>
  <path d="M 360 140 L 430 140" stroke="#4287f5" stroke-width="3" fill="none" marker-end="url(#arrowhead)">
    <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="0.7s" />
  </path>
  <path d="M 550 140 L 620 140" stroke="#4287f5" stroke-width="3" fill="none" marker-end="url(#arrowhead)">
    <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="1.2s" />
  </path>

  <!-- Vertical Arrow with animation -->
  <path d="M 680 180 L 680 210 L 300 210 L 300 240" stroke="#4287f5" stroke-width="3" fill="none" marker-end="url(#arrowhead)">
    <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="1.7s" />
  </path>

  <!-- Horizontal Arrows - Bottom Row with animation -->
  <path d="M 360 280 L 430 280" stroke="#4287f5" stroke-width="3" fill="none" marker-end="url(#arrowhead)">
    <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="2.2s" />
  </path>
  <path d="M 550 280 L 620 280" stroke="#4287f5" stroke-width="3" fill="none" marker-end="url(#arrowhead)">
    <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="2.7s" />
  </path>

  <!-- Enhanced Key Points with gradient and shadow -->
  <rect x="50" y="340" width="700" height="40" fill="url(#info-gradient)" stroke="#4287f5" stroke-width="2" rx="10" ry="10" filter="url(#shadow)" />
  <text x="400" y="365" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a365d">High-quality data preparation is crucial for successful fine-tuning • Always evaluate on held-out test data</text>
</svg>
