<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise Images</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .image-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .image-item { border: 1px solid #ddd; padding: 10px; border-radius: 5px; }
        .image-item img { max-width: 100%; height: auto; }
    </style>
</head>
<body>
    <h1>Exercise Images Directory</h1>
    <div class="image-grid">
        <div class="image-item">
            <h3>Data Preparation Flow</h3>
            <img src="data-preparation-flow.svg" alt="Data Preparation Flow">
        </div>
        <div class="image-item">
            <h3>LoRA Diagram</h3>
            <img src="lora-diagram.svg" alt="LoRA Diagram">
        </div>
        <div class="image-item">
            <h3>Pipeline Diagram</h3>
            <img src="pipeline-diagram.svg" alt="Pipeline Diagram">
        </div>
        <div class="image-item">
            <h3>QLoRA Diagram</h3>
            <img src="qlora-diagram.svg" alt="QLoRA Diagram">
        </div>
        <div class="image-item">
            <h3>Exercise Placeholder</h3>
            <img src="exercise-placeholder.svg" alt="Exercise Placeholder">
        </div>
    </div>
</body>
</html>
