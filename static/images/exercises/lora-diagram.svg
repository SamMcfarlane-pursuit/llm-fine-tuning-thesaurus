<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#f8f9fa" rx="10" ry="10" />
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">LoRA: Low-Rank Adaptation</text>
  
  <!-- Original Model Box -->
  <rect x="100" y="100" width="200" height="200" fill="#e9ecef" stroke="#495057" stroke-width="2" rx="10" ry="10" />
  <text x="200" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Pre-trained Model</text>
  <text x="200" y="155" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#495057">(Frozen Weights)</text>
  
  <!-- Original Model Layers -->
  <rect x="120" y="170" width="160" height="30" fill="#adb5bd" stroke="#495057" stroke-width="1" rx="5" ry="5" />
  <text x="200" y="190" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#212529">Attention Layer</text>
  
  <rect x="120" y="210" width="160" height="30" fill="#adb5bd" stroke="#495057" stroke-width="1" rx="5" ry="5" />
  <text x="200" y="230" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#212529">Feed-Forward Layer</text>
  
  <rect x="120" y="250" width="160" height="30" fill="#adb5bd" stroke="#495057" stroke-width="1" rx="5" ry="5" />
  <text x="200" y="270" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#212529">Output Layer</text>
  
  <!-- LoRA Modules -->
  <rect x="500" y="100" width="200" height="200" fill="#d0e8f2" stroke="#0077b6" stroke-width="2" rx="10" ry="10" />
  <text x="600" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0077b6">LoRA Adapters</text>
  <text x="600" y="155" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#0077b6">(Trainable Parameters)</text>
  
  <!-- LoRA Layers -->
  <rect x="520" y="170" width="160" height="30" fill="#90e0ef" stroke="#0077b6" stroke-width="1" rx="5" ry="5" />
  <text x="600" y="190" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#023e8a">Low-Rank Matrix A</text>
  
  <rect x="520" y="210" width="160" height="30" fill="#90e0ef" stroke="#0077b6" stroke-width="1" rx="5" ry="5" />
  <text x="600" y="230" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#023e8a">Low-Rank Matrix B</text>
  
  <!-- Connection Arrows -->
  <path d="M 300 185 L 500 185" stroke="#6c757d" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M 300 225 L 500 225" stroke="#6c757d" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6c757d" />
    </marker>
  </defs>
  
  <!-- Key Points -->
  <rect x="100" y="320" width="600" height="60" fill="#e6f2ff" stroke="#0077b6" stroke-width="1" rx="5" ry="5" />
  <text x="400" y="340" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Key Benefits:</text>
  <text x="400" y="365" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">Trains only ~0.1-1% of parameters • Memory efficient • Fast fine-tuning • Preserves pre-trained knowledge</text>
</svg>
