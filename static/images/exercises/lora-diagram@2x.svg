<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1600" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1600" height="800" fill="#f8f9fa" rx="20" ry="20" />
  
  <!-- Title -->
  <text x="800" y="80" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="#333">LoRA: Low-Rank Adaptation</text>
  
  <!-- Original Model Box -->
  <rect x="200" y="200" width="400" height="400" fill="#e9ecef" stroke="#495057" stroke-width="4" rx="20" ry="20" />
  <text x="400" y="260" font-family="Arial, sans-serif" font-size="36" font-weight="bold" text-anchor="middle" fill="#333">Pre-trained Model</text>
  <text x="400" y="310" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="#495057">(Frozen Weights)</text>
  
  <!-- Original Model Layers -->
  <rect x="240" y="340" width="320" height="60" fill="#adb5bd" stroke="#495057" stroke-width="2" rx="10" ry="10" />
  <text x="400" y="380" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="#212529">Attention Layer</text>
  
  <rect x="240" y="420" width="320" height="60" fill="#adb5bd" stroke="#495057" stroke-width="2" rx="10" ry="10" />
  <text x="400" y="460" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="#212529">Feed-Forward Layer</text>
  
  <rect x="240" y="500" width="320" height="60" fill="#adb5bd" stroke="#495057" stroke-width="2" rx="10" ry="10" />
  <text x="400" y="540" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="#212529">Output Layer</text>
  
  <!-- LoRA Modules -->
  <rect x="1000" y="200" width="400" height="400" fill="#d0e8f2" stroke="#0077b6" stroke-width="4" rx="20" ry="20" />
  <text x="1200" y="260" font-family="Arial, sans-serif" font-size="36" font-weight="bold" text-anchor="middle" fill="#0077b6">LoRA Adapters</text>
  <text x="1200" y="310" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="#0077b6">(Trainable Parameters)</text>
  
  <!-- LoRA Layers -->
  <rect x="1040" y="340" width="320" height="60" fill="#90e0ef" stroke="#0077b6" stroke-width="2" rx="10" ry="10" />
  <text x="1200" y="380" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="#023e8a">Low-Rank Matrix A</text>
  
  <rect x="1040" y="420" width="320" height="60" fill="#90e0ef" stroke="#0077b6" stroke-width="2" rx="10" ry="10" />
  <text x="1200" y="460" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="#023e8a">Low-Rank Matrix B</text>
  
  <!-- Formula -->
  <rect x="1040" y="500" width="320" height="60" fill="#90e0ef" stroke="#0077b6" stroke-width="2" rx="10" ry="10" />
  <text x="1200" y="540" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="#023e8a">W = W₀ + BA</text>
  
  <!-- Connection Arrows -->
  <path d="M 600 370 L 1000 370" stroke="#6c757d" stroke-width="4" fill="none" marker-end="url(#arrowhead)" />
  <path d="M 600 450 L 1000 450" stroke="#6c757d" stroke-width="4" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="20" markerHeight="14" refX="18" refY="7" orient="auto">
      <polygon points="0 0, 20 7, 0 14" fill="#6c757d" />
    </marker>
  </defs>
  
  <!-- Key Points -->
  <rect x="200" y="640" width="1200" height="120" fill="#e6f2ff" stroke="#0077b6" stroke-width="2" rx="10" ry="10" />
  <text x="800" y="680" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#333">Key Benefits:</text>
  <text x="800" y="730" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="#333">Trains only ~0.1-1% of parameters • Memory efficient • Fast fine-tuning • Preserves pre-trained knowledge</text>
</svg>
