<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#f8f9fa" rx="10" ry="10" />
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">Hugging Face Pipeline API</text>
  
  <!-- Input Box -->
  <rect x="50" y="100" width="150" height="80" fill="#e9ecef" stroke="#495057" stroke-width="2" rx="10" ry="10" />
  <text x="125" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Input Text</text>
  <text x="125" y="155" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#495057">"The synonym of happy is"</text>
  
  <!-- Pipeline Box -->
  <rect x="250" y="80" width="300" height="240" fill="#d1e7dd" stroke="#198754" stroke-width="2" rx="10" ry="10" />
  <text x="400" y="110" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#198754">pipeline("text-generation")</text>
  
  <!-- Pipeline Components -->
  <rect x="275" y="130" width="250" height="40" fill="#fff" stroke="#198754" stroke-width="1" rx="5" ry="5" />
  <text x="400" y="155" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">1. Tokenization</text>
  
  <rect x="275" y="180" width="250" height="40" fill="#fff" stroke="#198754" stroke-width="1" rx="5" ry="5" />
  <text x="400" y="205" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">2. Model Inference</text>
  
  <rect x="275" y="230" width="250" height="40" fill="#fff" stroke="#198754" stroke-width="1" rx="5" ry="5" />
  <text x="400" y="255" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">3. Post-processing</text>
  
  <!-- Output Box -->
  <rect x="600" y="100" width="150" height="80" fill="#e9ecef" stroke="#495057" stroke-width="2" rx="10" ry="10" />
  <text x="675" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Generated Text</text>
  <text x="675" y="155" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#495057">"The synonym of happy is joyful..."</text>
  
  <!-- Arrows -->
  <path d="M 200 140 L 250 140" stroke="#6c757d" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M 550 140 L 600 140" stroke="#6c757d" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6c757d" />
    </marker>
  </defs>
  
  <!-- Configuration Box -->
  <rect x="250" y="330" width="300" height="50" fill="#cfe2ff" stroke="#0d6efd" stroke-width="1" rx="5" ry="5" />
  <text x="400" y="350" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0d6efd">Pipeline Configuration Options</text>
  <text x="400" y="370" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#0d6efd">model, max_length, device, batch_size, temperature</text>
</svg>
