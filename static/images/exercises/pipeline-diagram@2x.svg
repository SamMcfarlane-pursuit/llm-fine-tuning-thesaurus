<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1600" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1600" height="800" fill="#f8f9fa" rx="20" ry="20" />
  
  <!-- Title -->
  <text x="800" y="80" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="#333">Hugging Face Pipeline API</text>
  
  <!-- Input Box -->
  <rect x="100" y="200" width="300" height="160" fill="#e9ecef" stroke="#495057" stroke-width="4" rx="20" ry="20" />
  <text x="250" y="260" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#333">Input Text</text>
  <text x="250" y="310" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#495057">"The synonym of happy is"</text>
  
  <!-- Pipeline Box -->
  <rect x="500" y="160" width="600" height="480" fill="#d1e7dd" stroke="#198754" stroke-width="4" rx="20" ry="20" />
  <text x="800" y="220" font-family="Arial, sans-serif" font-size="36" font-weight="bold" text-anchor="middle" fill="#198754">pipeline("text-generation")</text>
  
  <!-- Pipeline Components -->
  <rect x="550" y="260" width="500" height="80" fill="#fff" stroke="#198754" stroke-width="2" rx="10" ry="10" />
  <text x="800" y="310" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="#333">1. Tokenization</text>
  
  <rect x="550" y="360" width="500" height="80" fill="#fff" stroke="#198754" stroke-width="2" rx="10" ry="10" />
  <text x="800" y="410" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="#333">2. Model Inference</text>
  
  <rect x="550" y="460" width="500" height="80" fill="#fff" stroke="#198754" stroke-width="2" rx="10" ry="10" />
  <text x="800" y="510" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="#333">3. Post-processing</text>
  
  <!-- Output Box -->
  <rect x="1200" y="200" width="300" height="160" fill="#e9ecef" stroke="#495057" stroke-width="4" rx="20" ry="20" />
  <text x="1350" y="260" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#333">Generated Text</text>
  <text x="1350" y="310" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#495057">"The synonym of happy is joyful..."</text>
  
  <!-- Arrows -->
  <path d="M 400 280 L 500 280" stroke="#6c757d" stroke-width="4" fill="none" marker-end="url(#arrowhead)" />
  <path d="M 1100 280 L 1200 280" stroke="#6c757d" stroke-width="4" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="20" markerHeight="14" refX="18" refY="7" orient="auto">
      <polygon points="0 0, 20 7, 0 14" fill="#6c757d" />
    </marker>
  </defs>
  
  <!-- Configuration Box -->
  <rect x="500" y="660" width="600" height="100" fill="#cfe2ff" stroke="#0d6efd" stroke-width="2" rx="10" ry="10" />
  <text x="800" y="700" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#0d6efd">Pipeline Configuration Options</text>
  <text x="800" y="740" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#0d6efd">model, max_length, device, batch_size, temperature</text>
  
  <!-- Additional Information -->
  <rect x="100" y="660" width="300" height="100" fill="#f8d7da" stroke="#dc3545" stroke-width="2" rx="10" ry="10" />
  <text x="250" y="700" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#dc3545">Supported Tasks</text>
  <text x="250" y="740" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#dc3545">text-generation, translation, summarization...</text>
  
  <rect x="1200" y="660" width="300" height="100" fill="#fff3cd" stroke="#ffc107" stroke-width="2" rx="10" ry="10" />
  <text x="1350" y="700" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#856404">Performance</text>
  <text x="1350" y="740" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#856404">CPU/GPU/TPU acceleration available</text>
</svg>
