<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa" rx="10" ry="10" />
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">QLoRA: Quantized Low-Rank Adaptation</text>
  
  <!-- Original Model Box -->
  <rect x="100" y="100" width="200" height="240" fill="#e9ecef" stroke="#495057" stroke-width="2" rx="10" ry="10" />
  <text x="200" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Pre-trained Model</text>
  <text x="200" y="155" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#495057">(Frozen & Quantized)</text>
  
  <!-- Quantization Label -->
  <rect x="120" y="170" width="160" height="30" fill="#ffd166" stroke="#ef476f" stroke-width="1" rx="5" ry="5" />
  <text x="200" y="190" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">4-bit Quantization</text>
  
  <!-- Original Model Layers -->
  <rect x="120" y="210" width="160" height="30" fill="#adb5bd" stroke="#495057" stroke-width="1" rx="5" ry="5" />
  <text x="200" y="230" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#212529">Attention Layer</text>
  
  <rect x="120" y="250" width="160" height="30" fill="#adb5bd" stroke="#495057" stroke-width="1" rx="5" ry="5" />
  <text x="200" y="270" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#212529">Feed-Forward Layer</text>
  
  <rect x="120" y="290" width="160" height="30" fill="#adb5bd" stroke="#495057" stroke-width="1" rx="5" ry="5" />
  <text x="200" y="310" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#212529">Output Layer</text>
  
  <!-- LoRA Modules -->
  <rect x="500" y="100" width="200" height="240" fill="#d0e8f2" stroke="#0077b6" stroke-width="2" rx="10" ry="10" />
  <text x="600" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0077b6">LoRA Adapters</text>
  <text x="600" y="155" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#0077b6">(Full Precision)</text>
  
  <!-- Precision Label -->
  <rect x="520" y="170" width="160" height="30" fill="#06d6a0" stroke="#118ab2" stroke-width="1" rx="5" ry="5" />
  <text x="600" y="190" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">16/32-bit Precision</text>
  
  <!-- LoRA Layers -->
  <rect x="520" y="210" width="160" height="30" fill="#90e0ef" stroke="#0077b6" stroke-width="1" rx="5" ry="5" />
  <text x="600" y="230" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#023e8a">Low-Rank Matrix A</text>
  
  <rect x="520" y="250" width="160" height="30" fill="#90e0ef" stroke="#0077b6" stroke-width="1" rx="5" ry="5" />
  <text x="600" y="270" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#023e8a">Low-Rank Matrix B</text>
  
  <rect x="520" y="290" width="160" height="30" fill="#90e0ef" stroke="#0077b6" stroke-width="1" rx="5" ry="5" />
  <text x="600" y="310" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#023e8a">Scaling Factor (α)</text>
  
  <!-- Connection Arrows -->
  <path d="M 300 225 L 500 225" stroke="#6c757d" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M 300 265 L 500 265" stroke="#6c757d" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6c757d" />
    </marker>
  </defs>
  
  <!-- Memory Comparison -->
  <rect x="100" y="360" width="600" height="120" fill="#e6f2ff" stroke="#0077b6" stroke-width="1" rx="5" ry="5" />
  <text x="400" y="385" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Memory Efficiency Comparison</text>
  
  <!-- Memory Bars -->
  <rect x="150" y="400" width="500" height="20" fill="#dee2e6" stroke="#adb5bd" stroke-width="1" rx="3" ry="3" />
  <rect x="150" y="400" width="500" height="20" fill="#ef476f" stroke="#adb5bd" stroke-width="1" rx="3" ry="3" />
  <text x="660" y="415" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#333">Full Fine-tuning</text>
  
  <rect x="150" y="430" width="500" height="20" fill="#dee2e6" stroke="#adb5bd" stroke-width="1" rx="3" ry="3" />
  <rect x="150" y="430" width="125" height="20" fill="#118ab2" stroke="#adb5bd" stroke-width="1" rx="3" ry="3" />
  <text x="660" y="445" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#333">LoRA</text>
  
  <rect x="150" y="460" width="500" height="20" fill="#dee2e6" stroke="#adb5bd" stroke-width="1" rx="3" ry="3" />
  <rect x="150" y="460" width="30" height="20" fill="#06d6a0" stroke="#adb5bd" stroke-width="1" rx="3" ry="3" />
  <text x="660" y="475" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#333">QLoRA</text>
</svg>
