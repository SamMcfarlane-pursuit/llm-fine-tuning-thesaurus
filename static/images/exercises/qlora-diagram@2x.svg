<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1600" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet">
  <!-- Enhanced Background with gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f8ff;stop-opacity:1" />
    </linearGradient>

    <!-- Glow filter for highlighting -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Shadow filter for depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="8" dy="12" stdDeviation="8" flood-color="#000" flood-opacity="0.3" />
    </filter>

    <!-- Arrowhead marker with enhanced styling -->
    <marker id="arrowhead" markerWidth="20" markerHeight="14" refX="18" refY="7" orient="auto">
      <polygon points="0 0, 20 7, 0 14" fill="#4287f5" />
    </marker>
  </defs>

  <!-- Enhanced Background -->
  <rect width="1600" height="1000" fill="url(#bg-gradient)" rx="30" ry="30" filter="url(#shadow)" />

  <!-- Enhanced Title with shadow -->
  <text x="800" y="90" font-family="Arial, sans-serif" font-size="56" font-weight="bold" text-anchor="middle" fill="#1a365d" filter="url(#shadow)">QLoRA: Quantized Low-Rank Adaptation</text>
  <text x="800" y="150" font-family="Arial, sans-serif" font-size="32" text-anchor="middle" fill="#4a5568">Efficient Fine-Tuning for Large Language Models</text>

  <!-- Enhanced Original Model Box with gradient and shadow -->
  <rect x="200" y="200" width="400" height="480" fill="#e9ecef" stroke="#4287f5" stroke-width="6" rx="30" ry="30" filter="url(#shadow)">
    <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite" />
  </rect>
  <text x="400" y="260" font-family="Arial, sans-serif" font-size="40" font-weight="bold" text-anchor="middle" fill="#1a365d">Pre-trained Model</text>
  <text x="400" y="310" font-family="Arial, sans-serif" font-size="32" text-anchor="middle" fill="#4a5568">(Frozen & Quantized)</text>

  <!-- Enhanced Quantization Label with gradient -->
  <linearGradient id="quant-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:#ffd166;stop-opacity:1" />
    <stop offset="100%" style="stop-color:#ffb347;stop-opacity:1" />
  </linearGradient>
  <rect x="240" y="340" width="320" height="70" fill="url(#quant-gradient)" stroke="#ef476f" stroke-width="4" rx="16" ry="16" />
  <text x="400" y="386" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#333">4-bit Quantization</text>

  <!-- Enhanced Original Model Layers with gradients -->
  <linearGradient id="layer-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:#adb5bd;stop-opacity:1" />
    <stop offset="100%" style="stop-color:#868e96;stop-opacity:1" />
  </linearGradient>
  <rect x="240" y="430" width="320" height="70" fill="url(#layer-gradient)" stroke="#495057" stroke-width="4" rx="16" ry="16" />
  <text x="400" y="476" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#fff">Attention Layer</text>

  <rect x="240" y="510" width="320" height="70" fill="url(#layer-gradient)" stroke="#495057" stroke-width="4" rx="16" ry="16" />
  <text x="400" y="556" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#fff">Feed-Forward Layer</text>

  <rect x="240" y="590" width="320" height="70" fill="url(#layer-gradient)" stroke="#495057" stroke-width="4" rx="16" ry="16" />
  <text x="400" y="636" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#fff">Output Layer</text>

  <!-- Enhanced LoRA Modules with gradient and animation -->
  <linearGradient id="lora-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#d0e8f2;stop-opacity:1" />
    <stop offset="100%" style="stop-color:#90cdf4;stop-opacity:1" />
  </linearGradient>
  <rect x="1000" y="200" width="400" height="480" fill="url(#lora-gradient)" stroke="#4287f5" stroke-width="6" rx="30" ry="30" filter="url(#shadow)">
    <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite" />
  </rect>
  <text x="1200" y="260" font-family="Arial, sans-serif" font-size="40" font-weight="bold" text-anchor="middle" fill="#1a365d">LoRA Adapters</text>
  <text x="1200" y="310" font-family="Arial, sans-serif" font-size="32" text-anchor="middle" fill="#2b6cb0">(Full Precision)</text>

  <!-- Enhanced Precision Label with gradient -->
  <linearGradient id="precision-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:#06d6a0;stop-opacity:1" />
    <stop offset="100%" style="stop-color:#00b894;stop-opacity:1" />
  </linearGradient>
  <rect x="1040" y="340" width="320" height="70" fill="url(#precision-gradient)" stroke="#118ab2" stroke-width="4" rx="16" ry="16" />
  <text x="1200" y="386" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#333">16/32-bit Precision</text>

  <!-- Enhanced LoRA Layers with gradients -->
  <linearGradient id="lora-layer-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:#90e0ef;stop-opacity:1" />
    <stop offset="100%" style="stop-color:#4cc9f0;stop-opacity:1" />
  </linearGradient>
  <rect x="1040" y="430" width="320" height="70" fill="url(#lora-layer-gradient)" stroke="#0077b6" stroke-width="4" rx="16" ry="16" />
  <text x="1200" y="476" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#023e8a">Low-Rank Matrix A</text>

  <rect x="1040" y="510" width="320" height="70" fill="url(#lora-layer-gradient)" stroke="#0077b6" stroke-width="4" rx="16" ry="16" />
  <text x="1200" y="556" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#023e8a">Low-Rank Matrix B</text>

  <rect x="1040" y="590" width="320" height="70" fill="url(#lora-layer-gradient)" stroke="#0077b6" stroke-width="4" rx="16" ry="16" />
  <text x="1200" y="636" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#023e8a">Scaling Factor (α)</text>

  <!-- Enhanced Connection Arrows with animation -->
  <path d="M 600 450 L 1000 450" stroke="#4287f5" stroke-width="6" fill="none" marker-end="url(#arrowhead)">
    <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" />
  </path>
  <path d="M 600 530 L 1000 530" stroke="#4287f5" stroke-width="6" fill="none" marker-end="url(#arrowhead)">
    <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" />
  </path>

  <!-- Enhanced Memory Comparison with gradient and shadow -->
  <linearGradient id="memory-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" style="stop-color:#e6f2ff;stop-opacity:1" />
    <stop offset="100%" style="stop-color:#c5e3ff;stop-opacity:1" />
  </linearGradient>
  <rect x="200" y="720" width="1200" height="240" fill="url(#memory-gradient)" stroke="#4287f5" stroke-width="4" rx="20" ry="20" filter="url(#shadow)" />
  <text x="800" y="770" font-family="Arial, sans-serif" font-size="36" font-weight="bold" text-anchor="middle" fill="#1a365d">Memory Efficiency Comparison</text>

  <!-- Enhanced Memory Bars with gradients and labels -->
  <rect x="300" y="800" width="1000" height="40" fill="#dee2e6" stroke="#adb5bd" stroke-width="2" rx="10" ry="10" />
  <linearGradient id="full-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:#ef476f;stop-opacity:1" />
    <stop offset="100%" style="stop-color:#e63946;stop-opacity:1" />
  </linearGradient>
  <rect x="300" y="800" width="1000" height="40" fill="url(#full-gradient)" stroke="#adb5bd" stroke-width="2" rx="10" ry="10" />
  <text x="340" y="830" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="start" fill="#fff">100%</text>
  <text x="1320" y="830" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="start" fill="#333">Full Fine-tuning</text>

  <rect x="300" y="860" width="1000" height="40" fill="#dee2e6" stroke="#adb5bd" stroke-width="2" rx="10" ry="10" />
  <linearGradient id="lora-bar-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:#118ab2;stop-opacity:1" />
    <stop offset="100%" style="stop-color:#0077b6;stop-opacity:1" />
  </linearGradient>
  <rect x="300" y="860" width="250" height="40" fill="url(#lora-bar-gradient)" stroke="#adb5bd" stroke-width="2" rx="10" ry="10" />
  <text x="340" y="890" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="start" fill="#fff">25%</text>
  <text x="1320" y="890" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="start" fill="#333">LoRA</text>

  <rect x="300" y="920" width="1000" height="40" fill="#dee2e6" stroke="#adb5bd" stroke-width="2" rx="10" ry="10" />
  <linearGradient id="qlora-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:#06d6a0;stop-opacity:1" />
    <stop offset="100%" style="stop-color:#00b894;stop-opacity:1" />
  </linearGradient>
  <rect x="300" y="920" width="60" height="40" fill="url(#qlora-gradient)" stroke="#adb5bd" stroke-width="2" rx="10" ry="10" />
  <text x="340" y="950" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="start" fill="#fff">6%</text>
  <text x="1320" y="950" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="start" fill="#333">QLoRA</text>
</svg>
