<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#2c1a1a" rx="10" ry="10"/>
  <rect x="20" y="20" width="360" height="260" fill="#3c2a2a" rx="8" ry="8" stroke="#f56666" stroke-width="2"/>
  
  <!-- Code Window -->
  <rect x="40" y="50" width="320" height="200" fill="#0d1117" rx="5" ry="5"/>
  
  <!-- Code Lines -->
  <text x="60" y="80" font-family="monospace" font-size="12" fill="#e6edf3">from transformers import Trainer, TrainingArguments</text>
  <text x="60" y="100" font-family="monospace" font-size="12" fill="#e6edf3"></text>
  <text x="60" y="120" font-family="monospace" font-size="12" fill="#e6edf3"># Configure training</text>
  <text x="60" y="140" font-family="monospace" font-size="12" fill="#e6edf3">training_args = TrainingArguments(</text>
  <text x="60" y="160" font-family="monospace" font-size="12" fill="#e6edf3">    output_dir="./results",</text>
  <text x="60" y="180" font-family="monospace" font-size="12" fill="#e6edf3">    learning_rate=2e-4,</text>
  <text x="60" y="200" font-family="monospace" font-size="12" fill="#e6edf3">    num_train_epochs=3,</text>
  <text x="60" y="220" font-family="monospace" font-size="12" fill="#e6edf3">    gradient_accumulation_steps=4</text>
  <text x="60" y="240" font-family="monospace" font-size="12" fill="#e6edf3">)</text>
  
  <!-- Title -->
  <text x="200" y="35" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">Train the Model</text>
</svg>
