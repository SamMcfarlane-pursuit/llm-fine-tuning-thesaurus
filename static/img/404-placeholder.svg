<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.2" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg-gradient)" rx="10" ry="10" filter="url(#shadow)" />
  
  <!-- 404 Text -->
  <text x="200" y="120" font-family="Arial, sans-serif" font-size="72" font-weight="bold" text-anchor="middle" fill="#dc3545">404</text>
  <text x="200" y="160" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#495057">Page Not Found</text>
  
  <!-- Message -->
  <text x="200" y="200" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#6c757d">The page you are looking for does not exist.</text>
  <text x="200" y="225" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#6c757d">Please check the URL or go back to the homepage.</text>
  
  <!-- Border -->
  <rect width="396" height="296" x="2" y="2" stroke="#dc3545" stroke-width="2" fill="none" rx="8" ry="8" stroke-dasharray="10,5" />
</svg>
