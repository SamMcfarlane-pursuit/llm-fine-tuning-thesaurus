<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a72;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#009ffd;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#grad1)" rx="15" ry="15"/>
  
  <!-- Grid pattern -->
  <g stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.15">
    <g id="grid">
      <line x1="0" y1="50" x2="800" y2="50"/>
      <line x1="0" y1="100" x2="800" y2="100"/>
      <line x1="0" y1="150" x2="800" y2="150"/>
      <line x1="0" y1="200" x2="800" y2="200"/>
      <line x1="0" y1="250" x2="800" y2="250"/>
      <line x1="0" y1="300" x2="800" y2="300"/>
      <line x1="0" y1="350" x2="800" y2="350"/>
      <line x1="0" y1="400" x2="800" y2="400"/>
      <line x1="0" y1="450" x2="800" y2="450"/>
      <line x1="0" y1="500" x2="800" y2="500"/>
      <line x1="0" y1="550" x2="800" y2="550"/>
      
      <line x1="50" y1="0" x2="50" y2="600"/>
      <line x1="100" y1="0" x2="100" y2="600"/>
      <line x1="150" y1="0" x2="150" y2="600"/>
      <line x1="200" y1="0" x2="200" y2="600"/>
      <line x1="250" y1="0" x2="250" y2="600"/>
      <line x1="300" y1="0" x2="300" y2="600"/>
      <line x1="350" y1="0" x2="350" y2="600"/>
      <line x1="400" y1="0" x2="400" y2="600"/>
      <line x1="450" y1="0" x2="450" y2="600"/>
      <line x1="500" y1="0" x2="500" y2="600"/>
      <line x1="550" y1="0" x2="550" y2="600"/>
      <line x1="600" y1="0" x2="600" y2="600"/>
      <line x1="650" y1="0" x2="650" y2="600"/>
      <line x1="700" y1="0" x2="700" y2="600"/>
      <line x1="750" y1="0" x2="750" y2="600"/>
    </g>
  </g>
  
  <!-- Central Node -->
  <circle cx="400" cy="300" r="80" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="400" cy="300" r="75" fill="#4a6cf7"/>
  <text x="400" y="305" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#ffffff">LLM</text>
  <text x="400" y="330" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#ffffff">Fine-Tuning</text>
  
  <!-- Connected Nodes -->
  <!-- Node 1 -->
  <circle cx="200" cy="150" r="60" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="200" cy="150" r="55" fill="#00c896"/>
  <text x="200" y="155" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">LoRA</text>
  <line x1="265" y1="180" x2="340" y2="250" stroke="#ffffff" stroke-width="3" stroke-opacity="0.7"/>
  
  <!-- Node 2 -->
  <circle cx="600" cy="150" r="60" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="600" cy="150" r="55" fill="#ff6b6b"/>
  <text x="600" y="155" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">QLoRA</text>
  <line x1="535" y1="180" x2="460" y2="250" stroke="#ffffff" stroke-width="3" stroke-opacity="0.7"/>
  
  <!-- Node 3 -->
  <circle cx="200" cy="450" r="60" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="200" cy="450" r="55" fill="#feca57"/>
  <text x="200" y="455" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">PEFT</text>
  <line x1="265" y1="420" x2="340" y2="350" stroke="#ffffff" stroke-width="3" stroke-opacity="0.7"/>
  
  <!-- Node 4 -->
  <circle cx="600" cy="450" r="60" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="600" cy="450" r="55" fill="#5f27cd"/>
  <text x="600" y="445" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">Quanti-</text>
  <text x="600" y="470" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">zation</text>
  <line x1="535" y1="420" x2="460" y2="350" stroke="#ffffff" stroke-width="3" stroke-opacity="0.7"/>
  
  <!-- Small Nodes -->
  <!-- Small Node 1 -->
  <circle cx="100" cy="250" r="35" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="100" cy="250" r="32" fill="#1dd1a1"/>
  <text x="100" y="255" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Adapter</text>
  <line x1="135" y1="250" x2="320" y2="300" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="5,5"/>
  
  <!-- Small Node 2 -->
  <circle cx="700" cy="250" r="35" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="700" cy="250" r="32" fill="#ff9ff3"/>
  <text x="700" y="255" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Inference</text>
  <line x1="665" y1="250" x2="480" y2="300" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="5,5"/>
  
  <!-- Small Node 3 -->
  <circle cx="100" cy="350" r="35" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="100" cy="350" r="32" fill="#54a0ff"/>
  <text x="100" y="355" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Training</text>
  <line x1="135" y1="350" x2="320" y2="300" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="5,5"/>
  
  <!-- Small Node 4 -->
  <circle cx="700" cy="350" r="35" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="700" cy="350" r="32" fill="#ff9f43"/>
  <text x="700" y="355" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Data</text>
  <line x1="665" y1="350" x2="480" y2="300" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="5,5"/>
  
  <!-- Loading Animation -->
  <g>
    <circle cx="400" cy="300" r="100" stroke="#ffffff" stroke-width="4" stroke-opacity="0.3" fill="none">
      <animate attributeName="r" from="100" to="120" dur="2s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" from="0.3" to="0" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="400" cy="300" r="85" stroke="#ffffff" stroke-width="4" stroke-opacity="0.5" fill="none">
      <animate attributeName="r" from="85" to="105" dur="2s" begin="0.5s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" from="0.5" to="0" dur="2s" begin="0.5s" repeatCount="indefinite" />
    </circle>
  </g>
  
  <!-- Text at the bottom -->
  <text x="400" y="570" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff" filter="url(#glow)">
    LLM Fine-Tuning Concept Diagram
  </text>
</svg>
