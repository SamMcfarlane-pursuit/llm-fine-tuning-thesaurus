<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="4" dy="6" stdDeviation="4" flood-color="#000" flood-opacity="0.2" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg-gradient)" rx="15" ry="15" filter="url(#shadow)" />
  
  <!-- Title -->
  <text x="400" y="80" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#495057">Diagram Placeholder</text>
  
  <!-- Grid lines -->
  <g stroke="#dee2e6" stroke-width="1">
    <line x1="100" y1="150" x2="700" y2="150" />
    <line x1="100" y1="250" x2="700" y2="250" />
    <line x1="250" y1="100" x2="250" y2="300" />
    <line x1="550" y1="100" x2="550" y2="300" />
  </g>
  
  <!-- Placeholder boxes -->
  <rect x="150" y="170" width="100" height="60" fill="#adb5bd" stroke="#495057" stroke-width="2" rx="10" ry="10" />
  <rect x="350" y="170" width="100" height="60" fill="#adb5bd" stroke="#495057" stroke-width="2" rx="10" ry="10" />
  <rect x="550" y="170" width="100" height="60" fill="#adb5bd" stroke="#495057" stroke-width="2" rx="10" ry="10" />
  
  <!-- Arrows -->
  <g stroke="#6c757d" stroke-width="2" fill="none">
    <path d="M 250 200 L 350 200" />
    <path d="M 450 200 L 550 200" />
    <polygon points="345,195 355,200 345,205" fill="#6c757d" />
    <polygon points="545,195 555,200 545,205" fill="#6c757d" />
  </g>
  
  <!-- Message -->
  <rect x="200" y="320" width="400" height="40" fill="#e9ecef" stroke="#6c757d" stroke-width="1" rx="5" ry="5" />
  <text x="400" y="345" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#495057">Diagram image could not be loaded</text>
  
  <!-- Icon -->
  <circle cx="400" cy="140" r="30" fill="#f8f9fa" stroke="#6c757d" stroke-width="2" />
  <text x="400" y="148" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#6c757d">!</text>
</svg>
