<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f8ff;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.2" />
    </filter>
    <linearGradient id="frame-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e9ecef;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dee2e6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg-gradient)" rx="10" ry="10" filter="url(#shadow)" />

  <!-- Image Frame -->
  <rect x="100" y="70" width="200" height="140" fill="url(#frame-gradient)" stroke="#4287f5" stroke-width="2" rx="5" ry="5" />

  <!-- Image Icon -->
  <rect x="130" y="90" width="140" height="100" fill="#dee2e6" stroke="#4287f5" stroke-width="1" rx="3" ry="3" />
  <circle cx="155" cy="115" r="10" fill="#adb5bd" />
  <path d="M130 160 L 170 130 L 190 145 L 220 110 L 270 160 Z" fill="#adb5bd" stroke="#4287f5" stroke-width="1" />

  <!-- Mountain Icon -->
  <path d="M130 160 L 170 130 L 190 145 L 220 110 L 270 160" fill="none" stroke="#4287f5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Sun Icon -->
  <circle cx="155" cy="115" r="10" fill="#ffd166" stroke="#4287f5" stroke-width="1" />

  <!-- Message -->
  <text x="200" y="230" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a365d">Image Not Available</text>
  <text x="200" y="255" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#4a5568">Please check the image source</text>

  <!-- Border -->
  <rect width="396" height="296" x="2" y="2" stroke="#4287f5" stroke-width="2" fill="none" rx="8" ry="8" stroke-dasharray="5,5" />

  <!-- Warning Icon -->
  <circle cx="200" cy="45" r="15" fill="#ffd166" stroke="#e67e22" stroke-width="2" />
  <text x="200" y="50" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#e67e22">!</text>
</svg>
