{% extends 'base.html' %}

{% block title %}Forbidden - Visual LLM{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="error-container py-5">
                <h1 class="display-1 text-danger">403</h1>
                <h2 class="mb-4">Access Forbidden</h2>
                <p class="lead mb-4">You don't have permission to access this resource.</p>

                <div class="error-image mb-4">
                    <img src="{{ url_for('static', filename='images/403.svg') }}" alt="403 Error" class="img-fluid" style="max-height: 300px;">
                </div>

                <div class="mt-4">
                    <a href="{{ url_for('index') }}" class="btn btn-outline-primary me-2">
                        <i class="bi bi-house-door me-2"></i>Return to Home
                    </a>
                    <a href="{{ url_for('auth.login') }}" class="btn btn-primary">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                    </a>
                </div>
            </div>

            <div class="card mt-5">
                <div class="card-header bg-light">
                    <h5 class="mb-0">Need help?</h5>
                </div>
                <div class="card-body">
                    <p>Here are some helpful links:</p>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <a href="{{ url_for('learn') }}" class="btn btn-outline-secondary w-100">
                                <i class="bi bi-book me-2"></i>Learning Resources
                            </a>
                        </div>
                        <div class="col-md-4 mb-3">
                            <a href="{{ url_for('learn_and_explore') }}" class="btn btn-outline-secondary w-100">
                                <i class="bi bi-tools me-2"></i>Learn & Explore
                            </a>
                        </div>
                        <div class="col-md-4 mb-3">
                            <a href="{{ url_for('quiz.quiz_list') }}" class="btn btn-outline-secondary w-100">
                                <i class="bi bi-question-circle me-2"></i>Quizzes
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
