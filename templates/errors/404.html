{% extends base_template|default('base-simple.html') %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row">
        <div class="col-md-8 mx-auto text-center">
            <h1 class="display-1 text-muted">404</h1>
            <h2 class="mb-4">Page Not Found</h2>
            <p class="lead mb-4">The page you're looking for doesn't exist or has been moved.</p>
            <div class="d-grid gap-3 d-sm-flex justify-content-sm-center">
                <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg px-4 gap-3">Go Home</a>
                <a href="{{ url_for('contact') }}" class="btn btn-outline-secondary btn-lg px-4">Contact Support</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
