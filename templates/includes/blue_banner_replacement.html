{% macro blue_banner(text) %}
<div class="high-visibility-banner" style="
    background: linear-gradient(to right, #000066, #0033cc);
    border: 5px solid #ffffff;
    box-shadow: 0 0 0 3px #000000, 0 0 25px 8px rgba(0, 0, 255, 0.8), 0 0 40px rgba(255, 255, 255, 0.4);
    padding: 25px;
    margin: 25px 0;
    border-radius: 15px;
    position: relative;
    z-index: 100;
    display: block;
    width: auto;
    max-width: 100%;
    text-align: center;
">
    <!-- Semi-transparent overlay for better contrast -->
    <div style="
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 10px;
        z-index: 1;
    "></div>
    
    <!-- Container for the text -->
    <div class="banner-text-container" style="
        position: relative;
        z-index: 2;
        background-color: rgba(0, 0, 0, 0.5);
        padding: 10px 15px;
        border-radius: 8px;
        border: 2px solid rgba(255, 255, 255, 0.7);
        margin: 5px auto;
        width: fit-content;
        max-width: 90%;
        display: block;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
    ">
        {% for word in text.split() %}
            <span class="banner-word" style="
                background-color: rgba(0, 0, 0, 0.7);
                padding: 5px 10px;
                border-radius: 5px;
                margin: 3px;
                display: inline-block;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
                color: #ffffff;
                text-shadow: 0 0 5px #ffffff, 0 0 10px #ffffff, 0 2px 4px rgba(0, 0, 0, 0.9);
                font-weight: 900;
                letter-spacing: 0.05em;
                font-size: 1.2em;
            ">{{ word }}</span>
        {% endfor %}
    </div>
</div>
{% endmacro %}
