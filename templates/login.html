{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">Sign In</h3>
                </div>
                <div class="card-body">
                    {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}
                    
                    <form method="POST" action="{{ url_for('login') }}">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="remember" name="remember">
                            <label class="form-check-label" for="remember">Remember me</label>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Sign In</button>
                        </div>
                    </form>
                    
                    <hr>
                    
                    <div class="text-center">
                        <p>Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
                    </div>
                    
                    <div class="mt-4">
                        <h5>Sign in with:</h5>
                        <div class="d-flex justify-content-center gap-3 mt-3">
                            <a href="{{ url_for('oauth_login', provider='github') }}" class="btn btn-dark">
                                <i class="bi bi-github me-2"></i>GitHub
                            </a>
                            <a href="{{ url_for('oauth_login', provider='huggingface') }}" class="btn btn-primary">
                                <i class="bi bi-hdd-network me-2"></i>Hugging Face
                            </a>
                            <a href="{{ url_for('oauth_login', provider='google') }}" class="btn btn-danger">
                                <i class="bi bi-google me-2"></i>Google
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
