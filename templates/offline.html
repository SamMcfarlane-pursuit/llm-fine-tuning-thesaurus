
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual LLM - Offline</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/custom.css" rel="stylesheet">
    <style>
        .offline-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .offline-icon {
            font-size: 4rem;
            color: #6c757d;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div>
            <div class="offline-icon">📱</div>
            <h1 class="mb-3">You're Offline</h1>
            <p class="lead mb-4">
                No internet connection detected. Some features may not be available.
            </p>
            <div class="mb-4">
                <h5>Available Offline:</h5>
                <ul class="list-unstyled">
                    <li>✅ Cached learning materials</li>
                    <li>✅ Previously viewed content</li>
                    <li>✅ Offline notes and progress</li>
                </ul>
            </div>
            <button class="btn btn-primary" onclick="window.location.reload()">
                Try Again
            </button>
        </div>
    </div>
    
    <script>
        // Check for connection and reload when back online
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
